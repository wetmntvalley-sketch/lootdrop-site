<style>
  :root{

  html{scroll-behavior:smooth}

  a:hover{color:var(--gold)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
  .skip{position:absolute;left:-999px;top:8px;background:var(--gold);color:#000;padding:8px 12px;border-radius:8px;z-index:10}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  header.nav{position:sticky;top:0;z-index:5;background:rgba(11,11,18,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:800;letter-spacing:.3px;font-size:1.15rem}
  .brand svg{width:32px;height:32px}
  .nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0}
  .nav ul a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
  .nav ul a:hover{color:var(--text)}
  @media (max-width:640px){.nav ul{display:none}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:10px;border:0;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
  .btn-primary{background:linear-gradient(135deg,var(--legendary),#ff5f1f);color:#140a00;box-shadow:0 6px 24px -6px rgba(255,138,31,.6)}
  .btn-primary:hover{transform:translateY(-1px);color:#140a00;box-shadow:0 10px 30px -6px rgba(255,138,31,.75)}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--epic);color:var(--text)}
  .btn-epic{background:var(--epic);color:#fff}
  .btn-epic:hover{color:#fff;transform:translateY(-1px)}
  .hero{position:relative;overflow:hidden;padding:96px 0 80px;text-align:center}
  .hero::before{content:"";position:absolute;inset:-40% -10% auto;height:620px;background:radial-gradient(closest-side,rgba(168,85,247,.28),transparent 70%),radial-gradient(closest-side at 70% 60%,rgba(255,138,31,.22),transparent 70%);pointer-events:none}
  .hero > .wrap{position:relative}
  .hero-mark{display:block;width:92px;height:92px;margin:0 auto 18px;filter:drop-shadow(0 10px 30px rgba(255,138,31,.45))}
  .eyebrow{display:inline-block;font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(255,209,102,.35);padding:5px 12px;border-radius:999px;margin-bottom:18px}

  .tagline{font-size:clamp(1.1rem,2.4vw,1.35rem);color:var(--text);max-width:680px;margin:0 auto 10px}
  .sub{color:var(--muted);margin:0 auto 32px;max-width:560px}
  .hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  .badge{position:absolute;top:18px;right:18px;font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.1em;background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.45);padding:4px 9px;border-radius:999px}
  .tiers{display:flex;gap:6px;margin:4px 0 16px}
  .tier{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-weight:800;color:#0b0b12}
  .t-s{background:var(--legendary)} .t-a{background:var(--epic);color:#fff} .t-b{background:var(--rare);color:#fff} .t-c{background:var(--uncommon)}

  .inline-form{display:flex;gap:10px;flex-wrap:wrap}

  label{display:block;font-weight:600;margin:0 0 6px;font-size:.95rem}
  .hint{font-weight:400;color:var(--muted);font-size:.85rem}
  input,select,textarea{width:100%;font:inherit;color:var(--text);background:#0e0e17;border:1px solid var(--line);border-radius:10px;padding:12px 14px}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:640px){.grid-2{grid-template-columns:1fr}}
  .field{margin-bottom:16px}
  fieldset{border:0;padding:0;margin:0 0 16px}
  legend{font-weight:600;margin-bottom:8px;font-size:.95rem}
  .radios{display:flex;flex-wrap:wrap;gap:8px}
  .radios label{display:inline-flex;align-items:center;gap:8px;font-weight:500;background:#0e0e17;border:1px solid var(--line);border-radius:999px;padding:8px 14px;margin:0;cursor:pointer}
  .radios input{width:auto;accent-color:var(--legendary)}
  .radios label:has(input:checked){border-color:var(--legendary);color:var(--gold)}
  .fine{color:var(--muted);font-size:.85rem;margin:12px 0 0}
  .form-msg{margin-top:12px;font-weight:600;min-height:1.4em}
  .form-msg.ok{color:var(--uncommon)} .form-msg.warn{color:var(--gold)}
  .hp{position:absolute;left:-5000px}
  .rank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:900px){.rank-grid{grid-template-columns:1fr}}
  .rank-item{border-left:3px solid var(--epic);padding:4px 0 4px 18px}
  .rank-item h3{margin:0 0 6px;font-size:1.1rem}
  .rank-item p{margin:0;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:.9rem}
  footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
  footer ul{list-style:none;padding:0;margin:0;display:flex;gap:16px;flex-wrap:wrap}
  footer a{color:var(--muted)} footer a:hover{color:var(--text)}
  .disclosure{max-width:560px;margin:8px 0 0}
</style>
